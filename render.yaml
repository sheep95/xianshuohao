services:
  - type: web
    name: xianshuohao-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1"
      - key: WRITE_LIMIT_PER_MINUTE
        value: "60"
